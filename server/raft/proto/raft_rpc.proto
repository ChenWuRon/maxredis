//
// Wire schema for all Raft RPC payloads (raft_codec.cc serializes these
// messages inside a CRC-protected transport frame, see raft_codec.h).
//
// The messages mirror the C++ structs in server/raft/*_rpc.h one-to-one.
// proto3 semantics keep unknown-field forwarding and default-value
// compatibility: adding a field to any message below does not break
// rolling upgrades between nodes running different binaries.

syntax = "proto3";

package dfly.raft;

// A single Raft log entry (AppendEntriesRequest::entries).
message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  // RESP-encoded command bytes (binary-safe).
  bytes command = 3;
}

message AppendEntriesRequest {
  uint32 group_id = 1;
  uint64 term = 2;
  string leader_id = 3;
  uint64 prev_log_index = 4;
  uint64 prev_log_term = 5;
  repeated LogEntry entries = 6;
  uint64 leader_commit = 7;
}

message AppendEntriesResponse {
  uint32 group_id = 1;
  uint64 term = 2;
  bool success = 3;
  uint64 last_log_index = 4;
}

message VoteRequest {
  uint32 group_id = 1;
  uint64 term = 2;
  string candidate_id = 3;
  uint64 last_log_index = 4;
  uint64 last_log_term = 5;
}

message VoteResponse {
  uint32 group_id = 1;
  uint64 term = 2;
  bool vote_granted = 3;
}

// Heartbeat: an empty AppendEntries carrying the leader's commit index.
message HeartbeatRequest {
  uint32 group_id = 1;
  uint64 term = 2;
  string leader_id = 3;
  uint64 leader_commit = 4;
}

message HeartbeatResponse {
  uint32 group_id = 1;
  uint64 term = 2;
  bool success = 3;
  uint64 last_log_index = 4;
}

message InstallSnapshotRequest {
  uint32 group_id = 1;
  uint64 term = 2;
  string leader_id = 3;
  uint64 last_included_index = 4;
  uint64 last_included_term = 5;
  uint64 offset = 6;
  bool done = 7;
  // Chunk of the snapshot file at |offset|.
  bytes data = 8;
}

message InstallSnapshotResponse {
  uint32 group_id = 1;
  uint64 term = 2;
  bool success = 3;
}

// ReadIndex: linearizable read via leader commit-index confirmation.
message ReadIndexRequest {
  uint32 group_id = 1;
  uint64 term = 2;
  string leader_id = 3;
  uint64 request_id = 4;
}

message ReadIndexResponse {
  uint32 group_id = 1;
  uint64 term = 2;
  bool success = 3;
  uint64 commit_index = 4;
}

// TimeoutNow: leader-transfer fast path (skip the election timeout).
message TimeoutNowRequest {
  uint32 group_id = 1;
  uint64 term = 2;
  string leader_id = 3;
}

message TimeoutNowResponse {
  uint32 group_id = 1;
  uint64 term = 2;
  bool accepted = 3;
}
